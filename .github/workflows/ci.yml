name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt black isort flake8
      - run: black --check scripts
      - run: isort --check-only scripts
      - run: flake8 scripts
      - run: python scripts/generate_tables_and_figures.py
      - name: Committed tables must match regenerated tables
        # figs/ are excluded: matplotlib embeds timestamps, so figure PDFs
        # are byte-unstable across runs even with unchanged code.
        run: git diff --exit-code tabs

  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: endorsement.tex
          working_directory: ms
      - name: No unresolved references or citations
        # 'Warning.*undefined' also catches natbib's citation warnings,
        # which do not carry the 'LaTeX Warning' prefix.
        run: "! grep -q 'Warning.*undefined' ms/endorsement.log"
